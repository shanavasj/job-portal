# ===== Server =====
server.port=8081

# ===== PostgreSQL Database Connection =====
# Update username/password to match your local PostgreSQL setup.
# NOTE: Unlike MySQL, Postgres does NOT auto-create the database from this URL -
# you must create it yourself first (see README "Setup" step 2).
spring.datasource.url=jdbc:postgresql://localhost:5432/job_portal_db
spring.datasource.username=postgres
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update: Hibernate auto-creates/updates tables from your @Entity classes.
# Great for development; in a real production app you'd use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JSP View Resolver =====
# Tells Spring MVC where JSP files live and what to append to view names.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
