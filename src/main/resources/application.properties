# ===== Server =====
# Render/Railway set the PORT environment variable automatically; falls back to 8081 locally.
server.port=${PORT:8081}

# ===== PostgreSQL Database Connection =====
# Locally, these fall back to the values after the colon. In production (Render/Railway),
# set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD as
# environment variables in the platform's dashboard - never hardcode real credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_portal_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update: Hibernate auto-creates/updates tables from your @Entity classes.
# Great for development; in a real production app you'd use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JSP View Resolver =====
# Tells Spring MVC where JSP files live and what to append to view names.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp